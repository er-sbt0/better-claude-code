[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/agent-protocol",
    "crates/document-model",
    "crates/driver",
    "crates/event-log",
    "crates/normalizer",
    "crates/workspace-mcp",
    "crates/worktree",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
agent-protocol = { path = "crates/agent-protocol" }
normalizer = { path = "crates/normalizer" }
document-model = { path = "crates/document-model" }
driver = { path = "crates/driver" }
event-log = { path = "crates/event-log" }
workspace-mcp = { path = "crates/workspace-mcp" }
worktree = { path = "crates/worktree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"

[profile.dev]
# Keep file/line info for backtraces in our own crates, but skip full debug
# info: `target/debug` was dominated by dependency symbols.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies get no debug info at all — we don't step into them.
debug = false
