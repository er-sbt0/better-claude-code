[workspace]
resolver = "2"
members = ["crates/agent-protocol", "crates/normalizer"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
agent-protocol = { path = "crates/agent-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
