[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/agent-protocol",
    "crates/driver",
    "crates/event-log",
    "crates/normalizer",
    "crates/worktree",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
agent-protocol = { path = "crates/agent-protocol" }
normalizer = { path = "crates/normalizer" }
driver = { path = "crates/driver" }
event-log = { path = "crates/event-log" }
worktree = { path = "crates/worktree" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
